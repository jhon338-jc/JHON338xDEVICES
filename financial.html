<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Financial - JHON338xDEVICES</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="css/financial.css">
</head>
<body>

    <div class="financial-container">
        <!-- HEADER -->
        <header>
            <button class="back-btn" onclick="location.href='index.html'">
                <i class="fas fa-arrow-left"></i> BACK
            </button>
            <div class="header-title">FINAN<span class="accent">CIAL</span></div>
            <div class="header-balance">
                <i class="fas fa-coins"></i> <span id="header-balance">Rp 0</span>
            </div>
        </header>

        <main>
            <!-- PROFIL -->
            <div class="profile-card">
                <div class="profile-avatar" id="avatarWrap">
                    <img id="avatarImg" src="assets/profil.png" alt="Profil" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\'fas fa-user-astronaut\'></i>'">
                </div>
                <div class="profile-info">
                    <input type="text" id="nameInput" class="name-input" placeholder="Username" value="Jhon338" maxlength="20">
                    <button class="save-name-btn" id="saveNameBtn"><i class="fas fa-check"></i></button>
                </div>
            </div>

            <!-- SALDO -->
            <div class="balance-card">
                <div class="balance-label">SALDO SAAT INI</div>
                <div class="balance-amount" id="balanceNum">Rp 0</div>
                <div class="balance-stats">
                    <div class="stat-item income-stat">
                        <i class="fas fa-arrow-down"></i> Masuk: <span id="totalIncome">Rp 0</span>
                    </div>
                    <div class="stat-item expense-stat">
                        <i class="fas fa-arrow-up"></i> Keluar: <span id="totalExpense">Rp 0</span>
                    </div>
                </div>
            </div>

            <!-- INPUT TRANSAKSI -->
            <div class="section-title-wrapper">
                <div class="section-title">TRANSAKSI</div>
            </div>

            <div class="transaction-card">
                <div class="input-group">
                    <input type="text" id="financeInput" class="finance-input" placeholder="Masukkan nominal" inputmode="numeric">
                    <div class="btn-group">
                        <button class="action-btn income-btn" id="addIncomeBtn">
                            <i class="fas fa-plus-circle"></i> MASUK
                        </button>
                        <button class="action-btn expense-btn" id="addExpenseBtn">
                            <i class="fas fa-minus-circle"></i> KELUAR
                        </button>
                    </div>
                </div>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="quickAdd(5000)">+5K</button>
                    <button class="quick-btn" onclick="quickAdd(10000)">+10K</button>
                    <button class="quick-btn" onclick="quickAdd(20000)">+20K</button>
                    <button class="quick-btn" onclick="quickAdd(50000)">+50K</button>
                    <button class="quick-btn" onclick="quickAdd(100000)">+100K</button>
                </div>
                <button class="undo-btn" id="undoBtn">
                    <i class="fas fa-undo"></i> UNDO TRANSAKSI
                </button>
            </div>

            <!-- DAFTAR BELANJA -->
            <div class="section-title-wrapper">
                <div class="section-title">DAFTAR BELANJA</div>
            </div>

            <div class="shopping-card">
                <div class="input-row">
                    <input type="text" id="itemNameInput" class="item-input" placeholder="Nama barang">
                    <input type="text" id="itemPriceInput" class="item-input item-price" placeholder="Harga" inputmode="numeric">
                    <input type="number" id="itemQtyInput" class="item-input item-qty" value="1" min="1" max="99">
                    <button class="add-item-btn" id="addItemBtn">
                        <i class="fas fa-cart-plus"></i>
                    </button>
                </div>

                <div class="item-list" id="itemList">
                    <div class="empty-state">
                        <i class="fas fa-shopping-basket"></i>
                        <p>Belum ada barang</p>
                    </div>
                </div>

                <div class="item-actions">
                    <button class="nota-btn" id="showNotaBtn">
                        <i class="fas fa-receipt"></i> LIHAT NOTA
                    </button>
                    <button class="clear-items-btn" id="clearItemsBtn">
                        <i class="fas fa-trash-alt"></i> HAPUS SEMUA
                    </button>
                </div>
            </div>

            <!-- RIWAYAT -->
            <div class="section-title-wrapper">
                <div class="section-title">RIWAYAT</div>
            </div>

            <div class="history-card">
                <div class="history-list" id="historyList">
                    <div class="empty-state">
                        <i class="fas fa-history"></i>
                        <p>Belum ada riwayat</p>
                    </div>
                </div>
                <button class="reset-btn" id="resetBtn">
                    <i class="fas fa-bomb"></i> RESET SEMUA DATA
                </button>
            </div>

        </main>

        <!-- MODAL NOTA -->
        <div id="notaModal" class="modal-overlay" style="display:none;">
            <div class="modal-box">
                <div class="modal-title">
                    <i class="fas fa-receipt"></i> STRUK BELANJA
                </div>
                <div class="nota-scroll">
                    <div class="nota-paper" id="notaContent"></div>
                </div>
                <div class="modal-buttons">
                    <button class="modal-btn modal-close" id="closeNotaBtn">
                        <i class="fas fa-times"></i> TUTUP
                    </button>
                    <button class="modal-btn modal-download" id="downloadNotaBtn">
                        <i class="fas fa-download"></i> UNDUH PNG
                    </button>
                </div>
            </div>
        </div>

        <footer>
            <p>JHON338xDEVICES Financial</p>
            <p class="dev-credit">DEV BY JHON338</p>
            <p>© 2026 All Rights Reserved</p>
        </footer>
    </div>

    <script src="js/financial.js"></script>
</body>
</html>
